[package]
name = "carbon-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Concurrent, nonblocking async I/O in Rust with bounded buffering, out-of-order execution, and ordered output"
license = "MIT"
repository = "https://github.com/theking90000/carbon-io"
readme = "README.md"
keywords = ["async", "stream", "scheduler", "io", "backpressure"]
categories = ["asynchronous", "concurrency"]

[dependencies]
futures-core = "0.3.32"
pin-project-lite = "0.2.17"

[dev-dependencies]
stats_alloc = "0.1.10"
futures = "0.3.32"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "macros", "time"] }

[[bench]]
name = "scheduler"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
