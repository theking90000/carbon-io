[package]
name = "carbon-io"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
authors = ["theking90000 <martin.cogh@gmail.com>"]
description = "Concurrent Async Reordering Buffered Ordered Nonblocking I/O: reading and writing files with bounded buffering and ordered output"
license = "MIT"
repository = "https://github.com/theking90000/carbon-io"
homepage = "https://github.com/theking90000/carbon-io"
documentation = "https://docs.rs/carbon-io"
readme = "README.md"
keywords = ["async", "stream", "scheduler", "io", "backpressure"]
categories = ["asynchronous", "concurrency"]
include = [
    "/src",
    "/tests",
    "/benches",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/Cargo.toml",
]

[dependencies]
futures-core = "0.3.32"
pin-project-lite = "0.2.17"

[dev-dependencies]
stats_alloc = "0.1.10"
futures = "0.3.32"

[[bench]]
name = "scheduler"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
